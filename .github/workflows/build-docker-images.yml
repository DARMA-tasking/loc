name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate build matrix
        id: generate-matrix
        uses: docker/bake-action/subaction/matrix@v7
        with:
          target: loc-build-all
          files: docker-bake.hcl

  bake:
    runs-on: ubuntu-latest
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore cache
        id: ccache-archive
        uses: actions/cache@v5
        with:
          path: ccache-archive
          key: ${{ matrix.target }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.target }}-${{ github.ref }}
            ${{ matrix.target }}-

      - name: Inject ccache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "ccache-archive": {
                "target": "/build/ccache",
                "id": "${{ matrix.target }}"
              }
            }
          skip-extraction: ${{ steps.ccache-archive.outputs.cache-hit }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build
        uses: docker/bake-action@v7
        id: build-image
        with:
          source: .
          targets: ${{ matrix.target }}
          files: docker-bake.hcl
          push: ${{ github.ref == 'refs/heads/master' }}
          set: |
            *.args.CACHE_ID=${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
